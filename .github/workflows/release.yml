# Publish the two packages from a release tag.
#
# The code lives here and only here. composer cannot install from a folder
# inside a repository, so laravel/ is split out into the threadlive-laravel
# mirror; npm can publish from a folder, so react/ goes straight to npmjs.com
# as threadlive-react. Both take the tag as their version, so a backend and
# a widget at one tag speak the same API.
#
# Needs one secret, THREADLIVE_LARAVEL_TOKEN: a fine-grained token with
# Contents read/write on Mikhail-Kovchuk/threadlive-laravel and nothing else.
# npm needs none — see the react job.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # subtree split walks the history; a shallow clone has none.
          fetch-depth: 0
          # Otherwise checkout leaves this repository's GITHUB_TOKEN in the git
          # config as an auth header, git sends it in place of the token in the
          # mirror's URL, and the push is refused: that token cannot write
          # anywhere but here.
          persist-credentials: false

      - name: Push laravel/ to the mirror
        env:
          TOKEN: ${{ secrets.THREADLIVE_LARAVEL_TOKEN }}
        run: |
          git subtree split --prefix=laravel -b laravel-split
          mirror="https://x-access-token:${TOKEN}@github.com/Mikhail-Kovchuk/threadlive-laravel.git"
          # No --force. The split is deterministic, so every release is a
          # fast-forward; a rejection means someone committed to the mirror,
          # and overwriting that silently would lose it.
          git push "$mirror" laravel-split:refs/heads/main
          git push "$mirror" "laravel-split:refs/tags/${GITHUB_REF_NAME}"

  react:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this workflow's OIDC identity for a
      # one-off publish credential, so no npm token is stored anywhere. The
      # package's settings on npmjs.com name this repository and this file.
      id-token: write
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; the one bundled with
      # Node may be older.
      - run: npm install -g npm@latest

      # Before `npm ci`, whose `prepare` builds dist/: the build writes the
      # version into the bundle (VERSION). After it, a published release would
      # call itself 0.0.0-dev.
      - name: Take the version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # npm ci runs `prepare`, which builds dist/.
      - run: npm ci

      # A version already on the registry is skipped rather than failed: the
      # first release is published by hand (trusted publishing can only be
      # configured on a package that exists), and a re-run of a finished
      # release should not turn red.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "threadlive-react@${version}" version >/dev/null 2>&1; then
            echo "threadlive-react@${version} is already published; skipping"
          else
            npm publish
          fi
